<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testni ishlash</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="hero" style="padding-bottom:14px">
  <div class="flower">🌸</div>
  <h1 id="title">Test</h1>
  <p id="sub"></p>
  <div class="divider"></div>
</header>

<div class="narrow" id="app"><div class="empty">Yuklanmoqda…</div></div>

<script>
/* ============ O'QUVCHI SAHIFASI (telefonda ochiladi) ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
const topic = params.get('topic'), kind = params.get('kind');
let info, attemptId, questions = [], answers = [];

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Xatolik');
  return d;
}

async function init() {
  try {
    const r = await fetch(`/api/quiz-info/${encodeURIComponent(topic)}/${encodeURIComponent(kind)}`);
    if (!r.ok) throw new Error('Havola noto‘g‘ri. Mentoringizdan yangi havola so‘rang.');
    info = await r.json();
    const groups = await (await fetch('/api/groups')).json();
    document.title = info.kindLabel + ' — ' + info.topicNo + '-mavzu';
    $('#title').textContent = info.icon + ' ' + info.kindLabel;
    $('#sub').textContent = info.topicNo + '-mavzu: ' + info.topicTitle;
    startForm(groups);
  } catch (e) { $('#app').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

/* 1-qadam: guruh va ism familiya */
function startForm(groups) {
  if (!info.count) { $('#app').innerHTML = '<div class="card center"><p>Bu test uchun savollar hali tayyor emas.</p></div>'; return; }
  $('#app').innerHTML = `
    <div class="card">
      <div class="field"><label>Guruhingiz</label>
        <select id="group"><option value="">— tanlang —</option>${groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Ism va familiyangiz</label>
        <input id="name" placeholder="Masalan: Aliyeva Madina" autocomplete="name"></div>
      <div class="note">
        📌 ${info.count} ta savol. Siz bu ishni faqat <b>${info.maxAttempts} marta</b> bajara olasiz,
        ikkinchi urinish <b>${info.cooldown} daqiqadan</b> keyin ochiladi. Har safar ism-familiyangizni bir xil yozing.
        Boshlagandan keyin sahifani yopmang — urinish hisoblanib bo‘ladi.
      </div>
      <div id="err"></div>
      <button class="btn" id="go" style="width:100%;justify-content:center">Boshlash ✨</button>
    </div>`;
  $('#go').onclick = start;
}

async function start() {
  const btn = $('#go'); btn.disabled = true; $('#err').innerHTML = '';
  try {
    const d = await post('/api/start', { topic, kind, groupId: $('#group').value, name: $('#name').value });
    attemptId = d.attemptId; questions = d.questions; answers = new Array(questions.length).fill(null);
    renderQuiz(d.attemptNo, d.maxAttempts);
  } catch (e) { $('#err').innerHTML = `<div class="err">${esc(e.message)}</div>`; btn.disabled = false; }
}

/* 2-qadam: savollar */
function renderQuiz(no, max) {
  $('#app').innerHTML = `
    <div class="note">Urinish: ${no} / ${max}</div>
    <div class="progress"><i id="bar"></i></div>
    ${questions.map((q, i) => `
      <div class="card q">
        <h3><span class="num">${i + 1}</span><span>${esc(q.q)}</span></h3>
        ${q.situation ? `<div class="situation">${esc(q.situation)}</div>` : ''}
        ${q.options.map((o, j) => `<label class="opt" data-q="${i}"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}
      </div>`).join('')}
    <div id="err"></div>
    <button class="btn" id="send" style="width:100%;justify-content:center">Yakunlash ✅</button>`;
  document.querySelectorAll('.opt input').forEach(inp => inp.onchange = () => {
    const i = +inp.name.slice(1);
    answers[i] = +inp.value;
    document.querySelectorAll(`.opt[data-q="${i}"]`).forEach(l => l.classList.toggle('sel', l.querySelector('input').checked));
    $('#bar').style.width = (answers.filter(a => a !== null).length / questions.length * 100) + '%';
  });
  $('#send').onclick = submit;
  window.scrollTo(0, 0);
}

async function submit() {
  const left = answers.filter(a => a === null).length;
  if (left && !confirm(`${left} ta savolga javob bermadingiz. Baribir yakunlaysizmi?`)) return;
  const btn = $('#send'); btn.disabled = true;
  try {
    const d = await post('/api/submit', { attemptId, answers });
    result(d);
  } catch (e) { $('#err').innerHTML = `<div class="err">${esc(e.message)}</div>`; btn.disabled = false; }
}

/* 3-qadam: natija */
function result(d) {
  const msg = d.percent >= 86 ? 'Ajoyib natija! 🌟' : d.percent >= 71 ? 'Yaxshi! Yana bir oz harakat 💪' : 'Mavzuni qayta o‘qib chiqing 📖';
  $('#app').innerHTML = `
    <div class="card center">
      <h2 style="margin-top:0">Natijangiz</h2>
      <div class="ring" style="--p:${d.percent}"><span>${d.percent}%</span></div>
      <p style="font-size:18px;margin:0 0 6px"><b>${d.correct}</b> / ${d.total} ta to‘g‘ri javob</p>
      <p style="margin:0 0 14px">${msg}</p>
      <div class="note">${d.attemptsLeft
        ? `Sizda yana <b>${d.attemptsLeft}</b> ta urinish bor. U <b>${d.cooldown} daqiqadan</b> keyin ochiladi.`
        : 'Siz barcha urinishlaringizni ishlatdingiz. Natijangiz mentorga yuborildi.'}</div>
    </div>`;
  window.scrollTo(0, 0);
}
init();
</script>
</body>
</html>
